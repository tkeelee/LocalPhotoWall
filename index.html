<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>照片地图 · 时空轨迹</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{
    --bg:#0e1116;
    --panel:rgba(255,255,255,.92);
    --line:rgba(16,22,34,.10);
    --text:#141a22;
    --sub:#66707e;
    --brand:#2b6cff;
    --brand-2:#0f47c9;
    --danger:#e5484d;
    --r:14px;
    --shadow:0 8px 28px rgba(12,18,30,.18), 0 2px 6px rgba(12,18,30,.10);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-r:env(safe-area-inset-right,0px);
    --safe-l:env(safe-area-inset-left,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    color:var(--text);-webkit-font-smoothing:antialiased;
  }
  #map{position:absolute;inset:0;width:100%;height:100%;background:#e9edf2}
  .leaflet-container{font-family:inherit;background:#e9edf2}
  .leaflet-control-attribution{
    font-size:10px;background:rgba(255,255,255,.7);color:#7b8593;
    padding:1px 6px;border-radius:6px 0 0 0;
  }
  .leaflet-control-attribution a{color:#7b8593;text-decoration:none}

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .glass{
    background:var(--panel);
    backdrop-filter:saturate(180%) blur(18px);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    box-shadow:var(--shadow);
    border:1px solid rgba(255,255,255,.6);
  }
  .hidden{display:none !important}

  /* ---------- 右下控件栈 ---------- */
  #ctrlRight{
    position:absolute;z-index:600;
    right:calc(14px + var(--safe-r));
    bottom:calc(24px + var(--safe-b));
    display:flex;flex-direction:column;gap:10px;align-items:center;
  }
  .ctrl-group{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden}
  .ctrl-btn{
    width:44px;height:44px;display:flex;align-items:center;justify-content:center;
    color:#20293a;transition:background .15s ease,color .15s ease;position:relative;
  }
  .ctrl-btn:hover{background:rgba(43,108,255,.10);color:var(--brand)}
  .ctrl-btn:active{background:rgba(43,108,255,.18)}
  .ctrl-group .ctrl-btn + .ctrl-btn{border-top:1px solid var(--line)}
  .ctrl-btn.on{background:var(--brand);color:#fff}
  .ctrl-btn.on:hover{background:var(--brand-2)}
  .ctrl-btn svg{width:21px;height:21px;display:block}
  .ctrl-btn .badge{
    position:absolute;bottom:3px;right:4px;font-size:9px;font-weight:700;
    line-height:1;color:currentColor;opacity:.85;
  }

  /* ---------- 左下功能区 ---------- */
  #panelLeft{
    position:absolute;z-index:600;
    left:calc(14px + var(--safe-l));
    bottom:calc(24px + var(--safe-b));
    display:flex;flex-direction:column;gap:10px;align-items:flex-start;
  }
  .dock{display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;padding:0}
  .dock-btn{
    display:flex;align-items:center;justify-content:center;width:44px;height:44px;padding:0;border-radius:0;
    color:#20293a;transition:background .15s,color .15s;position:relative;
  }
  .dock-btn + .dock-btn{border-top:1px solid var(--line)}
  .dock-btn.icon-only{width:44px;height:44px;padding:0}
  .dock-btn svg{width:20px;height:20px;flex:none;display:block}
  .dock-btn:hover{background:rgba(43,108,255,.10);color:var(--brand)}
  .dock-btn:active{background:rgba(43,108,255,.18)}
  .dock-btn.primary{background:var(--brand);color:#fff}
  .dock-btn.primary:hover{background:var(--brand-2);color:#fff}
  .dock-btn.dirty::after{
    content:"";position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:#ff9500;
    box-shadow:0 0 0 3px rgba(255,149,0,.22);
  }

  #statBar{
    display:flex;align-items:center;gap:10px;padding:7px 13px;border-radius:11px;
    font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;
  }
  #statBar b{color:var(--text);font-weight:700;font-size:13px}
  #statBar .dot{width:5px;height:5px;border-radius:50%;background:#34c759}

  #importMenu{
    position:absolute;z-index:650;left:calc(14px + var(--safe-l));
    bottom:calc(78px + var(--safe-b));
    padding:6px;border-radius:var(--r);min-width:210px;
    animation:pop .18s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}
  .menu-item{display:flex;align-items:flex-start;gap:10px;width:100%;padding:9px 11px;border-radius:9px;text-align:left}
  .menu-item:hover{background:rgba(43,108,255,.09)}
  .menu-item svg{width:18px;height:18px;margin-top:1px;color:var(--brand);flex:none}
  .menu-item .t{font-size:13.5px;font-weight:600;display:block}
  .menu-item .d{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.35;display:block}

  /* ---------- 照片点位标记 ---------- */
  .leaflet-marker-icon.pm-icon{background:none;border:none;width:0 !important;height:0 !important}
  .pm{
    position:absolute;left:0;bottom:0;
    transform:translate(-50%,0) scale(var(--s,1));
    transform-origin:bottom center;
    transition:transform .3s cubic-bezier(.25,.9,.3,1.1);
    will-change:transform;cursor:pointer;
  }
  .pm-wobble{transform-origin:bottom center;display:block}
  .pm.shake .pm-wobble{animation:wob .55s cubic-bezier(.36,.07,.19,.97) both}
  @keyframes wob{
    0%{transform:rotate(0) translateY(0)}
    18%{transform:rotate(-5deg) translateY(-3px)}
    38%{transform:rotate(4.5deg) translateY(1px)}
    58%{transform:rotate(-3deg) translateY(-2px)}
    78%{transform:rotate(2deg) translateY(0)}
    100%{transform:rotate(0) translateY(0)}
  }
  .pm-box{
    width:36px;height:36px;margin-bottom:4px;border-radius:5px;overflow:hidden;background:#fff;
    border:1.5px solid #fff;
    box-shadow:0 3px 10px rgba(8,14,26,.28),0 0 0 1px rgba(8,14,26,.08);
    position:relative;
  }
  .pm-box img{width:100%;height:100%;object-fit:cover;display:block}
  .pm-box::after{
    content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);
    width:0;height:0;border-left:3px solid transparent;border-right:3px solid transparent;
    border-top:5px solid #fff;filter:drop-shadow(0 1px 1px rgba(8,14,26,.22));
  }
  .pm.active .pm-box{border-color:#ffd24a;box-shadow:0 4px 14px rgba(8,14,26,.38),0 0 0 2px rgba(255,210,74,.50)}
  .pm.active .pm-box::after{border-top-color:#ffd24a}
  .pm.no-time .pm-box{border-color:#e9edf3}
  /* 播放区间外的缩略图：橙色边框 + 降低不透明度（必须在 .active 之后，避免被覆盖） */
  .pm.pm-out .pm-box{opacity:.5;border-color:#ffa94d}
  .pm.pm-out .pm-box::after{border-top-color:#ffa94d}
  .pm.pm-out.active .pm-box{opacity:1}   /* 当前播放高亮即使被标记 out 也恢复 */

  /* ---------- 大图查看器 ---------- */
  #viewer{
    position:absolute;z-index:700;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;pointer-events:none;
    animation:vin .2s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes vin{from{opacity:0;transform:translate(-50%,-48%) scale(.94)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  #viewer .frame{
    padding:6px;border-radius:12px;background:rgba(255,255,255,.96);
    box-shadow:0 24px 70px rgba(6,10,20,.5),0 3px 10px rgba(6,10,20,.3);
    max-width:64vw;max-height:66vh;overflow:hidden;line-height:0;position:relative;
    pointer-events:auto;
  }
  /* 删除按钮样式 */
  .viewer-del{
    position:absolute;top:12px;right:12px;z-index:10;
    width:32px;height:32px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;
    display:flex;align-items:center;justify-content:center;
    opacity:.85;transition:opacity .2s, background .2s;
    pointer-events:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .viewer-del:hover{opacity:1;background:var(--danger)}
  .viewer-del svg{width:18px;height:18px;display:block}
  /* 编辑按钮样式（删除按钮左侧） */
  .viewer-edit{
    position:absolute;top:12px;right:52px;z-index:10;
    width:32px;height:32px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;
    display:flex;align-items:center;justify-content:center;
    opacity:.85;transition:opacity .2s, background .2s;
    pointer-events:auto;
    box-shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .viewer-edit:hover{opacity:1;background:var(--brand)}
  .viewer-edit svg{width:18px;height:18px;display:block}
  #viewerImg{display:block;max-width:100%;max-height:calc(66vh - 12px);border-radius:7px;object-fit:contain}
  #viewerMeta{
    margin-top:9px;padding:6px 13px;border-radius:9px;background:rgba(16,20,28,.82);
    color:#fff;font-size:12px;line-height:1.5;text-align:center;max-width:62vw;
    backdrop-filter:blur(10px);
    pointer-events:auto;
  }
  #viewerMeta .n{font-weight:600;font-size:12.5px}
  #viewerMeta .s{opacity:.72;font-size:11px;margin-top:1px;font-variant-numeric:tabular-nums}
  #viewerMeta .warn{color:#ffcf6b;font-size:11px;margin-top:2px}
  /* 查看器内编辑表单 */
  #viewerMeta .ve-form{text-align:left;display:flex;flex-direction:column;gap:7px;padding:2px 0}
  #viewerMeta .ve-row{display:flex;align-items:center;gap:8px}
  #viewerMeta .ve-row label{flex:0 0 64px;font-size:11px;opacity:.72;font-weight:600}
  #viewerMeta .ve-row input{
    flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid rgba(255,255,255,.3);
    border-radius:6px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-family:inherit;outline:none
  }
  #viewerMeta .ve-row input:focus{border-color:var(--brand);background:rgba(255,255,255,.18)}
  #viewerMeta .ve-row input.ro{background:rgba(255,255,255,.06);opacity:.6;cursor:default}
  #viewerMeta .ve-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
  #viewerMeta .ve-actions button{
    height:28px;padding:0 14px;border-radius:6px;border:none;cursor:pointer;
    font-size:12px;font-weight:600;font-family:inherit
  }
  #viewerMeta .ve-actions .ve-save{background:var(--brand);color:#fff}
  #viewerMeta .ve-actions .ve-save:hover{background:var(--brand-2)}
  #viewerMeta .ve-actions .ve-cancel{background:rgba(255,255,255,.18);color:#fff}
  #viewerMeta .ve-actions .ve-cancel:hover{background:rgba(255,255,255,.28)}

  /* ---------- 弹窗 ---------- */
  .mask{position:absolute;inset:0;z-index:800;background:rgba(9,13,20,.42);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{
    width:100%;max-width:390px;background:#fff;border-radius:18px;padding:22px;
    box-shadow:0 30px 80px rgba(6,10,20,.45);animation:pop .2s cubic-bezier(.2,.9,.3,1.15);
    max-height:88vh;overflow:auto;
  }
  .modal h3{margin:0 0 4px;font-size:17px;font-weight:700}
  .modal .desc{margin:0 0 18px;font-size:12.5px;color:var(--sub);line-height:1.55}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:6px}
  .field input,.field select{
    width:100%;height:40px;padding:0 11px;border-radius:10px;border:1px solid #dde2ea;
    font-size:13.5px;font-family:inherit;color:var(--text);background:#fbfcfe;outline:none;
  }
  .field input:focus,.field select:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(43,108,255,.12)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal-actions{display:flex;gap:9px;margin-top:20px}
  .btn{flex:1;height:42px;border-radius:11px;font-size:14px;font-weight:600;transition:.15s}
  .btn.ghost{background:#f1f3f7;color:#39424f}
  .btn.ghost:hover{background:#e7eaf1}
  .btn.solid{background:var(--brand);color:#fff}
  .btn.solid:hover{background:var(--brand-2)}
  .hintbox{background:#f5f8ff;border:1px solid #dfe8ff;border-radius:10px;padding:10px 12px;font-size:11.5px;line-height:1.6;color:#48566f}
  .hintbox b{color:var(--text)}

  /* ---------- 进度 / 提示 ---------- */
  #progress{
    position:absolute;z-index:750;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);
    min-width:270px;max-width:82vw;padding:12px 16px;border-radius:13px;
  }
  #progress .pt{display:flex;justify-content:space-between;align-items:baseline;gap:14px;font-size:12.5px;font-weight:600}
  #progress .pt span:last-child{color:var(--sub);font-variant-numeric:tabular-nums;font-size:11.5px}
  #progress .bar{height:5px;border-radius:3px;background:#e6eaf1;margin-top:8px;overflow:hidden}
  #progress .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#5b93ff);border-radius:3px;transition:width .2s}
  #progress .sub{font-size:11px;color:var(--sub);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog-cancel{display:block;width:fit-content;margin:8px 0 0 auto;background:#f1f3f7;color:#39424f;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600}
  .prog-cancel:hover{background:#e5e9f0}

  #toast{
    position:absolute;z-index:900;left:50%;top:50%;transform:translate(-50%,-50%);
    padding:12px 20px;border-radius:12px;background:rgba(18,22,30,.92);color:#fff;font-size:13.5px;
    backdrop-filter:blur(10px);box-shadow:0 8px 26px rgba(6,10,20,.35);max-width:84vw;text-align:center;
    animation:pop .18s ease;line-height:1.55;
  }

  /* ---------- 播放 HUD ---------- */
  #playHud{
    position:absolute;z-index:620;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);
    display:flex;align-items:center;gap:13px;padding:9px 10px 9px 15px;border-radius:14px;min-width:min(430px,90vw);
  }
  #playHud .info{flex:1;min-width:0}
  #playHud .nm{font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #playHud .tm{font-size:11px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
  #playHud .pbar{height:3px;border-radius:2px;background:#e6eaf1;margin-top:7px;position:relative}
  #playHud .pbar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s linear}
  /* 进度条可拖动手柄：透明 range 叠加在视觉进度条上，只显示白色圆点 thumb */
  #hudSeek{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    width:100%;height:14px;margin:0;padding:0;
    background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;
  }
  #hudSeek::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:12px;height:12px;border-radius:50%;background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.45);border:none;cursor:pointer;
  }
  #hudSeek::-moz-range-thumb{
    width:12px;height:12px;border-radius:50%;background:#fff;
    box-shadow:0 1px 4px rgba(0,0,0,.45);border:none;cursor:pointer;
  }
  /* 速度选择器 */
  #playHud .hud-speed select{
    height:32px;border-radius:8px;border:1px solid #e0e4ec;
    background:#f1f3f7;color:#39424f;font-size:12px;font-weight:600;
    padding:0 4px;cursor:pointer;outline:none;
  }
  #playHud .hud-speed select:hover{background:#e5e9f0}
  #playHud .hbtn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#f1f3f7;color:#39424f}
  #playHud .hbtn:hover{background:#e5e9f0}
  #playHud .hbtn.stop{background:rgba(229,72,77,.12);color:var(--danger)}
  #playHud .hbtn svg{width:16px;height:16px}

  /* ---------- DB 文件管理弹窗 ---------- */
  #dbManageModal .modal{max-width:min(960px,96vw);padding:18px 18px 16px}
  #dbManageModal .db-toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  #dbManageModal .db-toolbar .t{font-size:12.5px;color:var(--sub);margin-right:auto;font-variant-numeric:tabular-nums}
  #dbManageModal .db-toolbar .mini{
    height:32px;padding:0 11px;border-radius:8px;border:1px solid #dde2ea;background:#fbfcfe;
    font-size:12.5px;font-weight:600;color:#39424f;cursor:pointer;transition:.15s
  }
  #dbManageModal .db-toolbar .mini:hover{background:#eef1f7;border-color:var(--brand)}
  #dbManageModal .db-toolbar .mini.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
  #dbManageModal .db-toolbar .mini.primary:hover{background:var(--brand-2)}
  #dbManageModal .db-toolbar .mini.danger{color:var(--danger);border-color:#f3c9cb}
  #dbManageModal .db-toolbar .mini.danger:hover{background:#fdecec}
  .db-scroll{
    border:1px solid #e6eaf1;border-radius:10px;overflow:auto;max-height:46vh;min-height:160px;
    background:#fff
  }
  .db-scroll table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px;font-variant-numeric:tabular-nums}
  .db-scroll col.col-thumb{width:36px}
  .db-scroll col.col-hash{width:120px}
  .db-scroll col.col-name{width:140px}
  .db-scroll col.col-path{width:160px}
  .db-scroll col.col-time{width:140px}
  .db-scroll col.col-lat{width:80px}
  .db-scroll col.col-lng{width:80px}
  .db-scroll col.col-alt{width:64px}
  .db-scroll col.col-w{width:44px}
  .db-scroll col.col-h{width:44px}
  .db-scroll col.col-size{width:64px}
  .db-scroll col.col-ts{width:64px}
  .db-scroll col.col-import{width:120px}
  .db-scroll thead th{
    position:sticky;top:0;z-index:2;background:#f4f6fa;color:#48566f;font-weight:650;
    text-align:left;padding:8px 8px;border-bottom:1px solid #e0e4ec;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
  }
  .db-scroll tbody td{padding:5px 8px;border-bottom:1px solid #f0f2f6;vertical-align:middle;overflow:hidden}
  .db-scroll tbody tr{cursor:pointer}
  .db-scroll tbody tr:hover{background:#f7f9fd}
  .db-scroll tbody tr.sel{background:#eef4ff;box-shadow:inset 3px 0 0 var(--brand)}
  .db-scroll .thumb-cell{width:30px;height:22px;border-radius:3px;object-fit:cover;display:block}
  .db-scroll .hash-cell{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#66707e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .db-scroll .cell-text{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
  .db-scroll .cell-edit{width:100%;height:26px;padding:0 6px;border:1px solid var(--brand);border-radius:5px;font-size:12px;font-family:inherit;color:var(--text);background:#fff;outline:none}
  .db-scroll .cell-edit.dirty{border-color:#ff9500;background:#fff7ef}
  .db-empty{padding:30px 12px;text-align:center;color:var(--sub);font-size:12.5px}
  .db-detail{
    margin-top:8px;padding:8px 10px;border-radius:8px;background:#f7f9fd;border:1px solid #e6eaf1;
    font-size:11.5px;line-height:1.6;color:#48566f;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 12px
  }
  .db-detail>div{overflow:hidden;min-width:0}
  .db-detail b{color:var(--text);font-weight:650;display:block;margin-bottom:1px}
  .db-detail .full{grid-column:1 / -1}
  .db-detail img{width:64px;height:64px;border-radius:6px;object-fit:cover;border:1px solid #e6eaf1}
  .db-detail>div>br{display:none}
  .db-detail>div{word-break:break-all}
  .db-detail .hash-cell{white-space:nowrap;text-overflow:ellipsis}
  #dbManageModal .modal-actions{margin-top:12px}

  /* DB 筛选 + 分页 + 结果摘要 */
  #dbManageModal .db-filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
  #dbManageModal .db-filter-row label{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
  #dbManageModal .db-filter-row input[type="date"]{
    height:28px;padding:0 6px;border:1px solid #dde2ea;border-radius:6px;font-size:12px;color:var(--text);background:#fff;outline:none
  }
  #dbManageModal .db-filter-row .flbl{font-size:12px;color:var(--sub);font-weight:600}
  #dbManageModal .db-filter-row .fval{font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}
  #dbManageModal .db-filter-row .mini{height:28px;padding:0 9px;font-size:11.5px}
  #dbManageModal .db-page-row{
    display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums
  }
  #dbManageModal .db-page-row .mini{height:26px;padding:0 8px;font-size:11px}
  #dbManageModal .db-page-row .mini:disabled{opacity:.45;cursor:not-allowed}
  #dbManageModal .db-page-row .cur{font-weight:700;color:var(--text)}
  #dbManageModal .db-result{
    display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:8px 12px;
    border-radius:8px;background:#eef9ef;border:1px solid #b6e2bc;color:#276b33;font-size:12px;line-height:1.5
  }
  #dbManageModal .db-result b{font-weight:700}
  #dbManageModal .db-result .close{
    margin-left:auto;background:none;border:none;color:#276b33;cursor:pointer;font-size:15px;line-height:1
  }
  #dbManageModal .db-result.err{background:#fdecec;border-color:#f3c9cb;color:#a33}
  #dbManageModal .db-result .cnt-add{color:#1a7f37}
  #dbManageModal .db-result .cnt-upd{color:#1a5fb4}
  #dbManageModal .db-result .cnt-del{color:#a33}
  @media (max-width: 760px){
    .db-scroll .col-name{width:110px}
    .db-scroll .col-path{width:120px}
    .db-scroll .col-hash{width:90px}
    .db-scroll .col-time{width:110px}
    .db-scroll .col-import{width:90px}
  }

  /* ---------- 手动补录弹窗 ---------- */
  #manualModal .modal{max-width:440px}
  #manualModal .coord-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #manualModal .field input:disabled{background:#eef1f7;color:#66707e;cursor:not-allowed}
  #manualModal .file-pick{
    display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;
    border:1px dashed #c4ccda;background:#fbfcfe;font-size:12.5px;color:var(--sub);cursor:pointer
  }
  #manualModal .file-pick:hover{border-color:var(--brand);color:var(--brand)}
  #manualModal .file-pick.has{border-style:solid;color:var(--text);font-weight:600}
  #manualModal .file-pick .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .manual-hint{font-size:11.5px;color:var(--sub);line-height:1.55;margin:-4px 0 14px}
  .manual-hint b{color:var(--text)}
  /* 补录模式激活：地图光标十字 */
  body.manual-mode .leaflet-container{cursor:crosshair}
  #btnManual.on{background:var(--brand);color:#fff}
  #btnManual.on:hover{background:var(--brand-2)}

  /* ---------- 手机形态 ---------- */
  body.is-mobile #panelLeft{left:calc(14px + var(--safe-l));right:auto;bottom:calc(24px + var(--safe-b));padding:0;align-items:flex-start;flex-direction:column;gap:10px}
  body.is-mobile .dock{width:auto;border-radius:var(--r);padding:0}
  body.is-mobile .dock-btn{flex:none;flex-direction:column;gap:3px;width:44px;height:44px;padding:0}
  body.is-mobile .dock-btn svg{width:21px;height:21px}
  body.is-mobile #statBar{align-self:flex-start;margin-bottom:0}
  body.is-mobile #ctrlRight{bottom:calc(24px + var(--safe-b))}
  body.is-mobile #playHud{bottom:calc(96px + var(--safe-b));min-width:0;width:calc(100% - 20px)}
  body.is-mobile #importMenu{left:10px;right:10px;bottom:calc(90px + var(--safe-b));min-width:0}
  body.is-mobile #viewer .frame{max-width:88vw;max-height:62vh}
  body.is-mobile #viewerImg{max-height:calc(62vh - 12px)}
  body.is-mobile #toast{max-width:92vw}
  body.is-mobile .pm-box{width:30px;height:30px;margin-bottom:3px;border-radius:4px;border-width:1px}
</style>
</head>
<body>

<div id="map"></div>

<!-- 右下：图层 / 形态 / 缩放 -->
<div id="ctrlRight">
  <div class="ctrl-group glass">
    <button class="ctrl-btn" id="btnLayer" title="切换标准 / 卫星">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
    </button>
    <button class="ctrl-btn" id="btnDevice" title="切换电脑 / 手机形态">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="10" rx="1.5"/><path d="M2 18h11"/><rect x="16" y="10" width="6" height="11" rx="1.5"/></svg>
      <span class="badge" id="deviceBadge">PC</span>
    </button>
  </div>
  <div class="ctrl-group glass">
    <button class="ctrl-btn" id="btnZoomIn" title="放大">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="ctrl-btn" id="btnZoomOut" title="缩小">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </button>
  </div>
</div>

<!-- 左下：功能区 -->
<div id="panelLeft">
  <div id="statBar" class="glass hidden">
    <i class="dot"></i>
    <span><b id="statTotal">0</b> 张定位照片</span>
    <span id="statRange"></span>
  </div>
  <div class="dock glass">
    <button class="dock-btn icon-only" id="btnImport" title="导入照片" aria-label="导入照片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
    </button>
    <button class="dock-btn icon-only" id="btnLoad" title="增量加载数据" aria-label="增量加载数据">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.66 3.58 3 8 3s8-1.34 8-3v-13"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
    </button>
    <button class="dock-btn icon-only hidden" id="btnSave" title="保存数据" aria-label="保存数据">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
    </button>
    <button class="dock-btn icon-only" id="btnPlay" title="预览播放" aria-label="预览播放">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.5v15l13-7.5-13-7.5Z"/></svg>
    </button>
    <button class="dock-btn icon-only" id="btnDbManage" title="数据库直接管理" aria-label="数据库直接管理">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>
    </button>
    <button class="dock-btn icon-only" id="btnManual" title="手动补录" aria-label="手动补录">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg>
    </button>
    <!-- 【离线下载已禁用】按钮保留注释
    <button class="dock-btn icon-only" id="btnOffline" title="下载离线瓦片" aria-label="下载离线瓦片">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 18a5 5 0 0 1-1-9.9A6 6 0 0 1 19 8a4.5 4.5 0 0 1-1 8.9"/><path d="M12 12v6"/><path d="m9 15 3 3 3-3"/></svg>
    </button>
    -->
  </div>
</div>

<!-- 导入方式菜单 -->
<div id="importMenu" class="glass hidden">
  <button class="menu-item" data-act="dir">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
    <span><span class="t">选择文件夹</span><span class="d">自动递归扫描全部子目录中的照片</span></span>
  </button>
  <button class="menu-item" data-act="files">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m21 16-5.5-5.5L6 20"/></svg>
    <span><span class="t">选择照片</span><span class="d">可多选、可框选全选</span></span>
  </button>
</div>

<input type="file" id="dirInput" webkitdirectory directory multiple class="hidden">
<input type="file" id="fileInput" accept="image/*" multiple class="hidden">
<input type="file" id="dbInput" accept=".db,.sqlite,.sqlite3,application/octet-stream" class="hidden">
<input type="file" id="csvInput" accept=".csv,text/csv" class="hidden">
<input type="file" id="manualPhotoInput" accept="image/*" class="hidden">

<!-- 播放 HUD -->
<div id="playHud" class="glass hidden">
  <button class="hbtn" id="hudToggle" title="暂停 / 继续">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
  </button>
  <div class="info">
    <div class="nm" id="hudName">—</div>
    <div class="tm" id="hudTime">—</div>
    <div class="pbar">
      <i id="hudBar"></i>
      <input type="range" id="hudSeek" min="0" max="100" value="0" step="1" aria-label="播放进度">
    </div>
  </div>
  <div class="hud-speed">
    <select id="hudSpeed" aria-label="播放速度" title="播放速度">
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
      <option value="8">8×</option>
    </select>
  </div>
  <button class="hbtn stop" id="hudStop" title="停止">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
  </button>
</div>

<!-- 进度 -->
<div id="progress" class="glass hidden">
  <div class="pt"><span id="progTitle">正在处理</span><span id="progCount"></span></div>
  <div class="bar"><i id="progBar"></i></div>
  <div class="sub" id="progSub"></div>
  <!-- 【离线下载已禁用】 <button id="progCancel" class="prog-cancel hidden">取消</button> -->
</div>

<!-- 删除确认弹窗 -->
<div class="mask hidden" id="delModal">
  <div class="modal">
    <h3>删除照片</h3>
    <p class="desc">将立即从照片墙数据库文件内删除，切不可恢复，是否继续？</p>
    <div class="modal-actions">
      <button class="btn ghost" id="delCancel">否</button>
      <button class="btn solid" id="delConfirm" style="background:var(--danger)">是</button>
    </div>
  </div>
</div>

<!-- 数据库直接管理 -->
<div class="mask hidden" id="dbManageModal">
  <div class="modal">
    <h3>数据库直接管理</h3>
    <p class="desc" id="dbManageDesc">预览 / 编辑 / 导入 / 导出当前照片墙数据库。编辑仅可修改「文件名」与「照片路径」，其他字段只读。</p>

    <div class="db-result hidden" id="dbResult"></div>

    <div class="db-toolbar">
      <span class="t" id="dbManageSource">数据来源：当前内存数据库</span>
      <button class="mini" id="dbPickFile" title="选择其他 .db 文件预览">选择 db 文件</button>
      <button class="mini" id="dbExportCsv" title="导出为 CSV">导出 CSV</button>
      <button class="mini" id="dbImportCsv" title="用 CSV 全量覆盖（按哈希增改删）">导入 CSV 覆盖</button>
      <button class="mini primary" id="dbSaveEdit" title="保存编辑到数据库">保存修改</button>
    </div>

    <div class="db-filter-row">
      <span class="flbl">拍摄时间：</span>
      <label>从 <input type="date" id="dbFilterFrom"></label>
      <label>到 <input type="date" id="dbFilterTo"></label>
      <button class="mini" id="dbFilterReset">全部</button>
      <span class="fval" id="dbFilterInfo"></span>
    </div>

    <div class="db-scroll" id="dbScroll">
      <div class="db-empty">暂无数据</div>
    </div>

    <div class="db-page-row" id="dbPageRow"></div>

    <div class="db-detail hidden" id="dbDetail"></div>

    <div class="modal-actions">
      <button class="btn ghost" id="dbManageClose">关闭</button>
    </div>
  </div>
</div>

<!-- 手动补录 -->
<div class="mask hidden" id="manualModal">
  <div class="modal">
    <h3>手动补录点位</h3>
    <p class="desc">为没有 GPS 信息的照片手动指定坐标。长按地图选点后填写信息，保存即写入数据库并在地图显示。</p>
    <div class="coord-row">
      <div class="field"><label>纬度（WGS84）</label><input type="number" id="manualLat" step="0.000001" placeholder="如 39.90923"></div>
      <div class="field"><label>经度（WGS84）</label><input type="number" id="manualLng" step="0.000001" placeholder="如 116.397428"></div>
    </div>
    <div class="field">
      <label>拍摄时间</label>
      <input type="datetime-local" id="manualTime">
    </div>
    <div class="field">
      <label>点位照片</label>
      <label class="file-pick" id="manualFilePick">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/></svg>
        <span class="nm" id="manualFileName">点击选择照片</span>
      </label>
    </div>
    <div class="manual-hint" id="manualHint">提示：拍摄时间以照片 EXIF 为准（若存在），否则使用上方填写的时间。哈希重复的照片禁止保存。</div>
    <div class="modal-actions">
      <button class="btn ghost" id="manualCancel">取消</button>
      <button class="btn solid" id="manualSave">保存</button>
    </div>
  </div>
</div>

<!-- 播放设置 -->
<div class="mask hidden" id="playModal">
  <div class="modal">
    <h3>播放轨迹</h3>
    <p class="desc">按拍摄时间顺序依次高亮照片，地图只平移不缩放。</p>
    <div class="row2">
      <div class="field"><label>开始时间</label><input type="datetime-local" id="playStart"></div>
      <div class="field"><label>结束时间</label><input type="datetime-local" id="playEnd"></div>
    </div>
    <div class="field">
      <label>播放速度</label>
      <select id="playSpeed">
        <option value="0.5">0.5× 慢速</option>
        <option value="1" selected>1× 正常</option>
        <option value="2">2× 快速</option>
        <option value="4">4×</option>
        <option value="8">8× 极速</option>
      </select>
    </div>
    <div class="hintbox" id="playHint"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="playCancel">取消</button>
      <button class="btn solid" id="playConfirm">开始播放</button>
    </div>
  </div>
</div>

<!-- 【离线下载已禁用】以下弹窗保留注释，不启用 ——
<div class="mask hidden" id="offlineModal">
  <div class="modal">
    <h3>下载离线瓦片</h3>
    <p class="desc">把海外照片点位附近的地图瓦片下载到应用目录 tiles/ 下，之后地图优先读本地、秒开。需用 Chrome / Edge 打开本页面。</p>
    <div class="hintbox" id="offHint"></div>
    <div class="row2">
      <div class="field"><label>起始层级</label>
        <select id="offZmin">
          <option value="11">11</option><option value="12">12</option><option value="13" selected>13</option>
          <option value="14">14</option><option value="15">15</option>
        </select>
      </div>
      <div class="field"><label>结束层级</label>
        <select id="offZmax">
          <option value="13">13</option><option value="14">14</option><option value="15">15</option>
          <option value="16" selected>16</option><option value="17">17</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>点位边距（每方向瓦片数）</label>
        <select id="offMargin">
          <option value="1">1</option><option value="2">2</option><option value="3" selected>3</option>
          <option value="4">4</option><option value="5">5</option>
        </select>
      </div>
      <div class="field"><label>图层</label>
        <div style="display:flex;gap:14px;align-items:center;height:40px;font-size:13.5px">
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="offStd" checked> 标准图</label>
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="offSat" checked> 卫星+标注</label>
        </div>
      </div>
    </div>
    <div class="hintbox" id="offEst"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="offCancel">取消</button>
      <button class="btn solid" id="offStart">开始下载</button>
    </div>
  </div>
</div>
-->

<script src="vendor/leaflet.js"></script>
<script src="exif.js"></script>
<script src="app.js"></script>
</body>
</html>
